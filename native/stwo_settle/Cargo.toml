[package]
name = "nado-stwo-settle"
version = "0.1.0"
edition = "2024"
description = "NADO gen-29 settlement prototype (doc/stwo/g4-settlement-statement.md): compressed-tree path updates proven on Stwo over upstream's BLAKE2s components. Prototype only: nightly, prover-only, nothing on a consensus path."
license = "AGPL-3.0-or-later"
publish = false

[lib]
name = "nado_stwo_settle"
path = "src/lib.rs"

[dependencies]
# Pinned upstream Stwo, the same commit native/stwo_js uses.
stwo = { git = "https://github.com/starkware-libs/stwo", rev = "826591c6c371376810ca8213b5812d5daf6d5092", features = ["prover"] }
stwo-constraint-framework = { git = "https://github.com/starkware-libs/stwo", rev = "826591c6c371376810ca8213b5812d5daf6d5092", features = ["prover"] }
num-traits = "0.2.19"
itertools = "0.12"
tracing = "0.1"
educe = "0.6"
blake2 = "0.10.6"
rand = "0.8"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
