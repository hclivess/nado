[package]
name = "nado-mldsa44"
version = "0.1.0"
edition = "2021"
description = "NADO native ML-DSA-44 backend (FIPS 204 internal mode) — Rust cdylib bound by nado_pq_native.py"
license = "Apache-2.0 OR MIT"

[lib]
name = "nado_mldsa44"
crate-type = ["cdylib"]

[dependencies]
ml-dsa = "0.1"

[profile.release]
opt-level = 3
# THIN, not fat, LTO: the fat-LTO link (lto = true) peaks at enough RAM to OOM-kill the build on a
# small box — which is exactly the class of node (low-spec, pure-Python-fallback) that most needs the
# native backend. Thin LTO keeps essentially all the runtime speed at a fraction of the link memory.
lto = "thin"
