# NADO NFT dApp — serves static/nft.html at the root and proxies the exec/DA + L1 API to the node, so the page is
# same-origin (no CORS). Behind Cloudflare (edge SSL); origin cert reused from nadochain.com.
#
# INSTALL IT before linking the site: without this vhost the hostname still answers 200 — a wildcard server block
# serves a different app (autogame.nadochain.com once served Battleship this way), and a 200 is not evidence the
# right site is being served (tests/test_site_deployed.py).
server {
    listen 80; listen [::]:80;
    server_name nft.nadochain.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name nft.nadochain.com;
    ssl_certificate     /etc/letsencrypt/live/nadochain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nadochain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    location /exec/ { proxy_pass http://127.0.0.1:9273; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 300; client_max_body_size 20m; }
    location /da/   { proxy_pass http://127.0.0.1:9273; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 300; client_max_body_size 20m; }

    # MEDIA UPLOAD (scripts/operator/nft_upload.py on 127.0.0.1:9180): POST only, 6 MB body ceiling here (the service
    # enforces 5 MB, the file type, the rate limits and the storage cap). X-Real-IP is the TRUE client behind Cloudflare
    # (conf.d/cloudflare_realip.conf) — the per-client limit keys on it.
    location = /upload { limit_except POST { deny all; } client_max_body_size 6m; proxy_pass http://127.0.0.1:9180/upload; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 150; proxy_request_buffering on; }
    location = /upload/health { proxy_pass http://127.0.0.1:9180/upload/health; }

    # MEDIA, from this machine's IPFS node (nado-ipfs.service gateway, 127.0.0.1:8089). SANDBOXED: an uploaded file is
    # someone else's bytes on this origin, so it may never run script here — `sandbox` CSP and nosniff on every
    # response (the upload service also refuses every non-media type). Content-addressed, so it caches forever.
    location /ipfs/ { limit_except GET HEAD { deny all; } proxy_pass http://127.0.0.1:8089; proxy_set_header Host $host; proxy_read_timeout 60;
        proxy_hide_header Content-Security-Policy; add_header Content-Security-Policy "sandbox; default-src 'none'; img-src 'self' data:; media-src 'self'; style-src 'unsafe-inline'" always;
        add_header X-Content-Type-Options nosniff always; add_header Cache-Control "public, max-age=31536000, immutable" always; }

    # NFT page at the domain root
    location = / { proxy_pass http://127.0.0.1:9173/static/nft.html; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

    # everything else (static assets + L1 JSON API: /status, /get_latest_block, /submit_transaction, /get_account) -> the node
    location / { proxy_pass http://127.0.0.1:9173; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 120; client_max_body_size 2m; }
}
