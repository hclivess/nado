# NADO Land — serves static/land.html at the root, proxies the exec/DA + L1 API to the node (same-origin, no CORS), and
# /land/ (the world server's API and its websocket) to nado-land.service on 127.0.0.1:9176. Behind Cloudflare (edge
# SSL, websockets proxied); origin cert reused from nadochain.com.
#
# INSTALL IT before linking the site: without this vhost the hostname still answers 200 — the wildcard server block
# serves another app (land.nadochain.com served The Age of Gore before this file existed, 2026-11-06).
server {
    listen 80; listen [::]:80;
    server_name land.nadochain.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name land.nadochain.com;
    ssl_certificate     /etc/letsencrypt/live/nadochain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nadochain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    location /exec/ { proxy_pass http://127.0.0.1:9273; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 300; client_max_body_size 20m; }
    location /da/   { proxy_pass http://127.0.0.1:9273; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 300; client_max_body_size 20m; }

    # THE LIVE WORLD (scripts/land_server.py): its JSON API and the websocket every player and agent keeps open.
    # Upgrade/Connection are what make /land/ws a websocket through nginx; the long read timeout keeps an idle player
    # connected (the server pings every 30 s).
    location /land/ { proxy_pass http://127.0.0.1:9176; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade";
        proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 3600; client_max_body_size 2m; }

    # the Land page at the domain root
    location = / { proxy_pass http://127.0.0.1:9173/static/land.html; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }

    # everything else (static assets + L1 JSON API) -> the node
    location / { proxy_pass http://127.0.0.1:9173; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 120; client_max_body_size 2m; }
}
