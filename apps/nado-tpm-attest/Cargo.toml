[package]
name = "nado-tpm-attest"
version = "0.1.0"
edition = "2021"

# NO DEPENDENCIES ON PURPOSE: this is cross-compiled for Windows from the Linux fleet host
# (cargo build --release --target x86_64-pc-windows-gnu) and must build offline.

[[bin]]
name = "nado-tpm-attest"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
