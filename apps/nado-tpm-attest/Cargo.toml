[package]
name = "nado-tpm-attest"
version = "0.1.0"
edition = "2021"

# NO DEPENDENCIES ON PURPOSE: this is cross-compiled for Windows from the Linux fleet host
# (cargo build --release --target x86_64-pc-windows-gnu) and must build offline.

[lib]
name = "nado_tpm_attest"
path = "src/lib.rs"

[[bin]]
name = "nado-tpm-attest"
path = "src/main.rs"

[profile.release]
# Deliberately plain: lto + panic="abort" + strip turn a first-run fault into a silent vanish, which is
# precisely what was reported. Keep panics unwinding so the hook in main() can print them.
opt-level = "s"
