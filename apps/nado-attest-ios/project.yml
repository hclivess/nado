# XcodeGen spec — on a Mac: `brew install xcodegen && xcodegen generate` then open NadoAttest.xcodeproj.
# (A hand-written .pbxproj is fragile; this regenerates a correct one every time.)
name: NadoAttest
options:
  bundleIdPrefix: com.nadochain
  deploymentTarget:
    iOS: "16.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM: fill with the 10-character Team ID, or pick the team in Xcode's Signing tab
targets:
  NadoAttest:
    type: application
    platform: iOS
    supportedDestinations: [iOS, macCatalyst]
    sources: [NadoAttest]
    info:
      path: NadoAttest/Info.plist
      properties:
        CFBundleDisplayName: NADO Attest
        CFBundleURLTypes:
          - CFBundleURLName: com.nadochain.attest
            CFBundleURLSchemes: [nadoattest]
        AppIdentifierPrefix: $(AppIdentifierPrefix)
        ITSAppUsesNonExemptEncryption: false      # only Apple's CryptoKit / standard TLS: export-compliance exempt
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: NadoAttest/NadoAttest.entitlements
      properties:
        com.apple.developer.devicecheck.appattest-environment: production
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nadochain.attest
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
